<!doctype html>
<!--
  DJ VIEW. http://<server>:3000/dj
  Same search/preview as audience, plus the queue panel:
  Shooter types in requests from the room and the player advances through them.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karaoke List — DJ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Permanent+Marker&family=Special+Elite&family=Rock+Salt&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/styles.css">
</head>
<body class="role-dj">
  <!-- Logo: Rocky + Shooter neon as a small pinned photo. -->
  <div class="logo" title="Karaoke List" aria-label="Logo: Rocky + Shooter neon"></div>

  <main>
    <header class="wordmark">
      <h1><span class="role-pill">DJ</span> Karaoke List</h1>
      <div class="tagline">Karaoke <span class="dot">&bull;</span> Booth</div>
    </header>
    <p class="sub">Audience can't see this page. Their requests come on paper &mdash; you type them here.</p>

    <input id="singer" class="singer" type="text" placeholder="Singer's name (optional — attaches to the next queue add)" autocomplete="off">
    <input id="q" class="search" type="search" placeholder="Search by artist, title, or disc code…" autocomplete="off" autofocus>
    <div class="status" id="status">Type to search</div>

    <ul class="songs" id="songs"></ul>

    <section class="queue">
      <div class="queue-header">
        <h2>Queue <span class="count-badge" id="queue-count">0</span></h2>
        <button id="clear-queue-btn" class="clear-btn">Clear all</button>
      </div>
      <ul class="queue-list" id="queue-list"><li class="empty">Loading queue…</li></ul>
    </section>
  </main>

  <section id="player" class="player hidden" aria-label="Karaoke player">
    <button id="close" class="close-btn" title="Close (Esc) — stops, no advance">&times; Close</button>
    <button id="skip"  class="skip-btn"  title="Skip to next queued song">&#9197; Skip</button>
    <div id="now-playing" class="now">&mdash;</div>
    <div id="up-next" class="up-next"></div>
    <canvas id="canvas" width="300" height="216"></canvas>
    <audio id="audio" controls preload="auto"></audio>
    <p class="hint"><strong>Esc</strong> closes. <strong>Skip</strong> jumps to the next queued song. Songs do not auto-advance &mdash; click Skip when ready.</p>
  </section>

  <script type="module" src="/app.js"></script>
</body>
</html>
