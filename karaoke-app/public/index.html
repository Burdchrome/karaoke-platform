<!doctype html>
<!--
  AUDIENCE VIEW. http://<server>:3000/
  A clean "digital songbook": search + preview on your own phone.
  No queue, no requests, no now-playing — the DJ takes requests in person.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karaoke List</title>

  <!-- Fonts are self-hosted (see styles.css @font-face) — bar LANs may have no internet. -->
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Logo: Rocky + Shooter neon as a small pinned photo. -->
  <div class="logo" title="Karaoke List" aria-label="Logo: Rocky + Shooter neon"></div>

  <main>
    <header class="wordmark">
      <h1>Karaoke List</h1>
      <div class="tagline">Karaoke <span class="dot">&bull;</span> Songbook</div>
    </header>
    <p class="sub">Search and preview. To request a song, find the DJ.</p>

    <input id="q" class="search" type="search" placeholder="Search by artist, title, or disc code…" autocomplete="off" autofocus>
    <div class="status" id="status">Type to search</div>

    <ul class="songs" id="songs"></ul>
  </main>

  <section id="player" class="player hidden" aria-label="Karaoke player">
    <button id="close" class="close-btn" title="Close (Esc)">&times; Close</button>
    <div id="now-playing" class="now">&mdash;</div>
    <canvas id="canvas" width="300" height="216"></canvas>
    <!-- No `controls`: the audience gets a custom bar below. The native
         scrubber invited seeking that the 30s preview clamp then fought;
         this one is play/pause + progress only. DJ page keeps native controls. -->
    <audio id="audio" preload="auto"></audio>

    <div id="audio-ui" class="audio-ui">
      <button id="pp" class="pp-btn" aria-label="Play or pause">&#9654;</button>
      <div class="progress-track" aria-hidden="true"><div id="progress-fill" class="progress-fill"></div></div>
      <span id="time-label" class="time-label">0:00 / 0:30</span>
    </div>

    <!-- Request slip: shown when the 30s preview ends. The hand-off moment —
         requests happen on paper to the DJ, so show exactly what to write. -->
    <div id="request-slip" class="request-slip hidden">
      <div class="slip-tag">That was the 30-second preview</div>
      <div class="slip-song" id="slip-song"></div>
      <div class="slip-disc" id="slip-disc"></div>
      <div class="slip-cta">Like it? Write it down &mdash; go tell the DJ.</div>
      <button id="slip-done" class="slip-done-btn">Done</button>
    </div>

    <p id="preview-hint" class="hint">Tap the Close button (top right) when you're done.</p>
  </section>

  <script type="module" src="/app.js"></script>
</body>
</html>
